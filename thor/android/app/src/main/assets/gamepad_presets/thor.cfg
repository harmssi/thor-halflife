// Thor Half-Life gamepad layout (AYN Thor, Xbox-style positions).
// The classic HUD weapon menu is on the second screen, so the bumpers switch weapons instantly.
joy_unbindall

// face buttons by label (Xbox semantics: A jump, B duck, X reload, Y use)
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "+use"

// bumpers: previous / next weapon (instant, no menu)
bind "L1_BUTTON" "thor_wprev"
bind "R1_BUTTON" "thor_wnext"

// triggers
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"

// dpad
bind "DPAD_UP" "impulse 100"
bind "DPAD_DOWN" "lastinv"
bind "DPAD_LEFT" "savequick"
bind "DPAD_RIGHT" "+showscores"

// stick clicks
bind "STICK1" "+speed"
bind "STICK2" "+duck"

bind "BACK" "+showscores"
bind "START" "cancelselect"

joy_axis_binding "sfpyrl"
// the Thor has a built-in gyroscope; gyro aiming is off by default (joy_gyro_enable 1 to try it)
joy_gyro_enable 0
joy_touchpad_right_mode off
joy_touchpad_left_mode off
